name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify tests & notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install numpy matplotlib pytest nbformat nbclient ipykernel

      - name: Run unit tests
        run: python -m pytest -q tests

      - name: Check Colab numeric dropdowns have raw type
        run: |
          if grep -n "#@param" src/*.py | grep "\[" | grep -v '"' | grep -v "raw"; then
            echo "Error: numeric #@param dropdowns must include {type:\"raw\"}"
            exit 1
          fi

      - name: Execute built notebooks
        run: python tests/run_notebooks.py
